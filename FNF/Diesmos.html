<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Fullscreen Game</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: black;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <iframe
    src="https://script.google.com/macros/s/AKfycbyZbeN77xlGgmRQ2-Z2vAepcu5rtVsZe_9IkR7faG1CLjh01hpIp5eZRxxHIU1d6qd0zw/exec"
    allowfullscreen>
  </iframe>

</body>
</html>
